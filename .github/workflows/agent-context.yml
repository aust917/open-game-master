name: Agent context

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check instruction budgets and local documentation links
        run: node scripts/check-agent-context.mjs
